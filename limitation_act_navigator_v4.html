<style>

"Prices, loans, bonds, bills, sureties, fraud, dower, mortgages, contract"}, {"n": 13, "p": 2, "c": "#5AAF8A", "s": "Arts 116\u2013149", "t": "Suits: six to sixty years", "h": "Registered contracts, judgments, land, redemption, Government"}, {"n": 14, "p": 2, "c": "#AF6A5A", "s": "Arts 150\u2013183", "t": "Appeals and applications", "h": "Divisions II and III: days and months, review, set aside, residue"}];
var MD={"1": {"intro": "Part I and the first sentence of Part II. The Act says where it reaches, defines eleven terms, and then states its one big rule: a claim brought late is dismissed, even if the other side never complains. Everything else in the Act is a way of moving that deadline.", "rails": [{"code": "s.1", "term": "Short title, extent and commencement", "sub": "whole of Pakistan; in force 1 January 1909", "hook": "A statute introduces itself: name, reach, start date.", "plain": "<b>Reach:</b> the whole of Pakistan (s.1(2)). <b>Start:</b> s.1 and s.31 took effect at once; the rest from 1 January 1909 (s.1(3)). This is a 1908 Act adapted for Pakistan, so the printed text carries amendment brackets and a few asterisks for omitted words.", "tag": "Context", "links": [], "blocks": [{"h": "s.1 Short title, extent and commencement", "paras": [{"t": "(1) This Act may be called the *Limitation Act, 1908.", "l": 0}, {"t": "[(2) It extends to the whole of Pakistan.]", "l": 0}, {"t": "(3) This section and section 31 shall come into force at once. The rest of this Act shall come into force on the first day of January, 1909.", "l": 0}], "ills": []}]}, {"code": "s.2(1),(4),(8)", "term": "Applicant, defendant, plaintiff", "sub": "each includes the person from or through whom the right or liability is derived", "covers": ["s.2(1)", "s.2(4)", "s.2(8)"], "hook": "Time does not reset when the parties change. A successor stands in the predecessor\u2019s shoes.", "plain": "Because \u201cplaintiff\u201d includes anyone <b>from or through whom</b> he derives his right to sue, a clock that began against the original owner keeps running against his heir or assignee. The same works on the defendant\u2019s side. The Act then adds a few special cases where a death or a new party does change the timing: ss.17 and 22.", "tag": "Adjusts: who the clock runs against", "links": [{"l": "s.17", "m": 6, "sec": "s.17"}, {"l": "s.22", "m": 6, "sec": "s.22"}], "blocks": [{"h": "s.2 Definitions", "paras": [{"t": "In this Act, unless there is anything repugnant in the subject or context,", "l": 0}, {"t": "(1) \u201capplicant\u201d includes any person from or through whom an applicant derives his right to apply:", "l": 0}, {"t": "(4) \u201cdefendant\u201d includes any person from or through whom a defendant derives his liability to be sued:", "l": 0}, {"t": "(8) \u201cplaintiff\u201d includes any person from or through whom a plaintiff derives his right to sue :", "l": 0}], "ills": []}]}, {"code": "s.2(2),(3),(9)", "term": "Bill of exchange, bond, promissory note", "sub": "the instruments with their own entries in the Schedule", "covers": ["s.2(2)", "s.2(3)", "s.2(9)"], "hook": "Three paper promises, each with a drawer of its own in the Schedule.", "plain": "\u201cBill of exchange\u201d and \u201cpromissory note\u201d take the meaning they have in the Negotiable Instruments Act, 1881; the bill definition expressly includes a hundi and a cheque. A \u201cbond\u201d is an instrument by which a person obliges himself to pay money on a condition that the obligation shall be void if a specified act is done or not done. You will meet them again in Arts 66 to 80.", "tag": "Definition", "links": [{"l": "Art 66", "m": 12, "sec": "Arts 65\u201380"}, {"l": "Art 69", "m": 12, "sec": "Arts 65\u201380"}], "blocks": [{"h": "s.2 Definitions", "paras": [{"t": "In this Act, unless there is anything repugnant in the subject or context,", "l": 0}, {"t": "[(2) \u201cbill of exchange\u201d has the same meaning as in section 5 of the Negotiable Instruments Act, 1881 (XXVI of 1881), and includes a hundi and a cheque,]", "l": 0}, {"t": "(3) \u201cbond\u201d includes any instrument whereby a person obliges himself to pay money to another on condition that the obligation shall be void if a specified act is performed, or is not performed, as the case may be :", "l": 0}, {"t": "[(9)] \u201cpromissory note\u201d has the same meaning as in the Negotiable Instruments Act, 1881 (XXVI of 1881);]", "l": 0}], "ills": []}]}, {"code": "s.2(5)", "term": "Easement", "sub": "a right not arising from contract to remove and appropriate soil or growth", "covers": ["s.2(5)"], "hook": "Here the word \u201ceasement\u201d is stretched to cover taking things off another man\u2019s land.", "plain": "The definition includes a right, not arising from contract, to remove and appropriate for one\u2019s own profit part of the soil, or anything growing on or attached to the land of another. So the twenty-year rule of s.26 reaches these rights as well as paths and light. Remember s.29(4): where the Easements Act, 1882 extends, ss.26\u201327 and this definition do not apply.", "tag": "Definition", "links": [{"l": "s.26", "m": 8, "sec": "s.26"}, {"l": "s.29", "m": 8, "sec": "s.29"}], "blocks": [{"h": "s.2 Definitions", "paras": [{"t": "In this Act, unless there is anything repugnant in the subject or context,", "l": 0}, {"t": "(5) \u201ceasement\u201d includes a right not arising from contract, by which one person is entitled to remove and appropriate for his own profit any part of the soil belonging to another or anything growing in, or attached to or subsisting upon, the land of another:", "l": 0}], "ills": []}]}, {"code": "s.2(6)", "term": "Foreign country", "sub": "any country other than Pakistan", "covers": ["s.2(6)"], "hook": "The mirror image of \u201cPakistan\u201d: everything outside is foreign.", "plain": "Used by s.11 (suits on foreign contracts) and by the absence rule in s.13, which speaks of territories beyond Pakistan.", "tag": "Definition", "links": [{"l": "s.11", "m": 4, "sec": "s.11"}, {"l": "s.13", "m": 5, "sec": "s.13"}], "blocks": [{"h": "s.2 Definitions", "paras": [{"t": "In this Act, unless there is anything repugnant in the subject or context,", "l": 0}, {"t": "(6) \u201cforeign country\u201d means any country other than [Pakistan * * *]:", "l": 0}], "ills": []}]}, {"code": "s.2(7)", "term": "Good faith", "sub": "nothing is in good faith which is not done with due care and attention", "covers": ["s.2(7)"], "exam": true, "hook": "Honest but careless is not \u201cgood faith\u201d in this Act.", "plain": "This is a statutory test, tougher than plain honesty: the act must be done with <b>due care and attention</b>. It matters most in s.14, where a plaintiff can only deduct the time spent in the wrong court if he was prosecuting in good faith.", "tag": "Definition", "links": [{"l": "s.14", "m": 5, "sec": "s.14"}], "blocks": [{"h": "s.2 Definitions", "paras": [{"t": "In this Act, unless there is anything repugnant in the subject or context,", "l": 0}, {"t": "(7) \u201cgood faith\u201d : nothing shall be deemed to be done in good faith which is not done with due care and attention:", "l": 0}], "ills": []}]}, {"code": "s.2(10)", "term": "Suit", "sub": "does not include an appeal or an application", "covers": ["s.2(10)"], "exam": true, "hook": "Three words, three drawers: suit, appeal, application.", "plain": "This is why the Schedule has three Divisions, and why s.5 (extension for sufficient cause) rescues appeals and applications but not suits.", "tag": "Definition", "links": [{"l": "s.5", "m": 2, "sec": "s.5"}, {"l": "Art 120", "m": 9, "sec": "Art 120"}, {"l": "Art 181", "m": 9, "sec": "Art 181"}], "blocks": [{"h": "s.2 Definitions", "paras": [{"t": "In this Act, unless there is anything repugnant in the subject or context,", "l": 0}, {"t": "(10) \u201csuit\u201d does not include an appeal or an application: and", "l": 0}], "ills": []}]}, {"code": "s.2(11)", "term": "Trustee", "sub": "excludes a benamidar, a mortgagee after satisfaction, a wrong-doer in possession", "covers": ["s.2(11)"], "hook": "Three people who hold property but are not trustees for this Act.", "plain": "The exclusions are: (1) a <b>benamidar</b>; (2) a <b>mortgagee remaining in possession after the mortgage has been satisfied</b>; (3) a <b>wrong-doer in possession without title</b>. They matter for s.10, which gives express trustees no limitation shelter.", "tag": "Definition", "links": [{"l": "s.10", "m": 4, "sec": "s.10"}, {"l": "Art 105", "m": 12, "sec": "Arts 105\u2013115"}], "blocks": [{"h": "s.2 Definitions", "paras": [{"t": "In this Act, unless there is anything repugnant in the subject or context,", "l": 0}, {"t": "(11) \u201ctrustee\u201d does not include a benamidar, a mortgagee remaining in possession after the mortgage has been satisfied, or a wrong-doer in possession without title.", "l": 0}], "ills": []}]}, {"code": "s.3", "term": "Dismissal of suits, etc., after the period", "sub": "late means dismissed, even if limitation is not pleaded", "ess": "The bar", "exam": true, "hook": "The court is the watchman: it dismisses a stale claim even when the defendant stays silent.", "plain": "<b>Four ingredients.</b> (1) A <b>suit, appeal or application</b>; (2) filed <b>after the period prescribed by the First Schedule</b>; (3) <b>subject to ss.4 to 25</b>, which are the exceptions; (4) the court <b>dismisses it although limitation has not been set up as a defence</b>.<br>The Explanation fixes the moment of institution in three situations (see the boundary map below).<br><i>Textbook comment, not from the Act:</i> the Act bars the remedy rather than extinguishing the right. s.28 (headed \u201cExtinguishment of right to property\u201d) is printed as omitted in this text.", "tag": "The master rule", "links": [{"l": "s.4", "m": 2, "sec": "s.4"}, {"l": "s.5", "m": 2, "sec": "s.5"}, {"l": "s.28", "m": 8, "sec": "s.28"}, {"l": "Art 120", "m": 9, "sec": "Art 120"}], "blocks": [{"h": "s.3 Dismissal of suits, etc., instituted, etc., after period of limitation", "paras": [{"t": "Subject to the provisions contained in sections 4 to 25 (inclusive), every suit institute, appeal preferred, and application made, after the period of limitation prescribed therefore by the first schedule shall be dismissed, although limitation has not been set up as a defence.", "l": 0}, {"t": "Explanation. A suit is instituted, in ordinary cases, when the plaint is presented to the proper officer; in the case of a pauper, when his application for leave to sue as a pauper is made; and, in the case of a claim against a company which is being wound up by the Court, when the claimant first sends in his claim to the official liquidator.", "l": 0}], "ills": []}]}], "spar": [{"q": "The defendant never raises limitation and the suit is plainly late. Must the court still dismiss it? Name the words that decide.", "a": "Yes. s.3 says the suit \u201cshall be dismissed, although limitation has not been set up as a defence\u201d. The court looks at the date itself, subject to the exceptions in ss.4 to 25."}, {"q": "Why can\u2019t a late <i>suit</i> be saved by s.5, while a late appeal can?", "a": "s.2(10) says a suit does not include an appeal or an application, and s.5 speaks only of \u201cany appeal or application\u201d. A plaintiff must find another exception: ss.6 to 9, 12 to 16, 17 to 25."}, {"q": "A sues as a pauper. His application for leave is made on 3 March; the plaint is formally presented on 10 April. When is the suit instituted? Contrast a creditor claiming against a company in winding up.", "a": "Pauper: when the application for leave to sue as a pauper is made (3 March). Company in winding up by the Court: when the claimant first sends his claim to the official liquidator. Ordinary suits: when the plaint is presented to the proper officer. All three come from the Explanation to s.3."}, {"q": "X dies with a debt owed to him. His heir sues. Does the clock run from X\u2019s cause of action or from the heir\u2019s succession?", "a": "From X\u2019s. s.2(8) says \u201cplaintiff\u201d includes anyone from or through whom he derives his right to sue, so time that started against X continues. s.17 only changes this where X died <i>before</i> the right accrued."}], "boundary": "<b>Boundary map: what counts as a \u201csuit\u201d?</b><table class='btbl'><tr><th>Proceeding</th><th>\u201cSuit\u201d (s.2(10))?</th><th>Where the period sits</th></tr><tr><td>Plaint in a civil court</td><td>Yes</td><td>First Schedule, Division I (Arts 1\u2013149)</td></tr><tr><td>Appeal</td><td>No</td><td>Division II (Arts 150\u2013157)</td></tr><tr><td>Application (review, execution, leave, set aside)</td><td>No</td><td>Division III (Arts 158\u2013183)</td></tr></table><b>When is a suit \u201cinstituted\u201d (s.3 Explanation)?</b><table class='btbl'><tr><th>Case</th><th>Instituted when</th></tr><tr><td>Ordinary suit</td><td>Plaint presented to the proper officer</td></tr><tr><td>Pauper</td><td>Application for leave to sue as a pauper is made</td></tr><tr><td>Claim against a company being wound up</td><td>Claimant first sends in his claim to the official liquidator</td></tr></table>", "recall": "<b>Quick recall</b>The limitation equation: deadline = start point (Schedule col. 3) + period (col. 2) + excluded time (ss.12\u201316) + extensions (ss.4\u20139), with fresh starts (ss.19\u201321). s.3 is the gate: late means dismissed, pleaded or not."}, "2": {"intro": "Two doors out of a missed deadline. The first (s.4) is narrow: the last day fell on a day the court was shut. The second (s.5) is wider but narrower in reach: sufficient cause excuses delay, for appeals and applications only.", "rails": [{"code": "s.4", "term": "Where Court is closed when period expires", "sub": "file on the day the Court re-opens", "ess": "The bar", "exam": false, "hook": "A locked courthouse door stops the clock only on the day it is locked.", "plain": "<b>Ingredients.</b> (1) The period for a suit, appeal or application <b>expires</b> on a day (2) when the court is <b>closed</b>; then (3) it may be filed on the <b>day the court re-opens</b>. The section helps only when the last day itself is a closure day. A closure earlier in the period does not extend it.", "tag": "Adjusts: period (extension)", "links": [{"l": "s.5", "m": 2, "sec": "s.5"}, {"l": "s.12", "m": 5, "sec": "s.12"}], "blocks": [{"h": "s.4 Where Court is closed when period expires", "paras": [{"t": "Where the period of limitation prescribed for any suit, appeal or application expires on a day when the Court is closed, the suit, appeal or application may be instituted, preferred or made on the day that the Court re-opens.", "l": 0}], "ills": []}]}, {"code": "s.5", "term": "Extension of period in certain cases", "sub": "sufficient cause: appeals and applications only", "exam": true, "hook": "Delay with a good reason earns a second chance, but only for appeals and applications, never a plain suit.", "plain": "<b>Ingredients.</b> (1) An <b>appeal</b>, an application for <b>revision</b> or <b>review</b>, an application for <b>leave to appeal</b>, or another application to which s.5 is made applicable by an enactment; (2) filed <b>after the period</b>; (3) the appellant or applicant satisfies the court of <b>sufficient cause</b> for not filing in time. <b>Explanation:</b> being misled by an order, practice or judgment of the High Court in working out the period may be sufficient cause.<br>It is one of the \u201csections 4 to 25\u201d that s.3 is subject to.", "tag": "Adjusts: period (extension)", "links": [{"l": "s.3", "m": 1, "sec": "s.3"}, {"l": "s.2(10)", "m": 1, "sec": "s.2(10)"}, {"l": "s.29", "m": 8, "sec": "s.29"}], "blocks": [{"h": "s.5 Extension of period in certain cases", "paras": [{"t": "Any appeal or application for [a revision or] a review of judgment or for leave to appeal or any other application to which this section may be made applicable [by or under any enactment] for the time being in force may be admitted after the period of limitation prescribed therefor, when the appellant or applicant satisfies the Court that he had sufficient cause for not preferring the appeal or making the application within such period.", "l": 0}, {"t": "Explanation. The fact that the appellant or applicant was misled by any order, practice or judgment of the High Court in ascertaining or computing the prescribed period of limitation may be sufficient cause within the meaning of this section.", "l": 0}], "ills": []}]}], "spar": [{"q": "An appeal\u2019s last day is a court holiday. What is the last day for filing? What if the holiday was the day before the last day?", "a": "First case: s.4, file on the day the court re-opens. Second case: s.4 does not help, because it deals only with the day the period <i>expires</i>. The appellant would need sufficient cause under s.5 and an application for condonation."}, {"q": "A plaintiff is five days late filing a suit because his lawyer was ill. Is s.5 available?", "a": "No. s.5 covers appeals and applications; s.2(10) separates a suit from both. He needs another exception (for example s.14 wrong court, s.15 stay or notice, ss.6 to 9 disability, s.18 fraud)."}, {"q": "An appellant relied on a High Court practice about counting days and was wrong. What does the Act say, and what must he still do?", "a": "The Explanation to s.5 says being misled by an order, practice or judgment of the High Court in ascertaining or computing the period may be sufficient cause. He still has to apply and satisfy the court; it is not automatic."}, {"q": "Before you reach for s.5 in a late appeal, which provision in Part III should you apply first, and why?", "a": "s.12(2) to (5): exclude the day of the judgment and the time requisite for obtaining the copy of the decree or order. The appeal may turn out to be in time, and no condonation is needed."}], "boundary": "<b>Boundary map: s.4 and s.5</b><table class='btbl'><tr><th>Situation</th><th>s.4</th><th>s.5</th></tr><tr><td>Last day of the period is a day the court is closed (suit)</td><td>Yes: file on re-opening day</td><td>Not available (suit)</td></tr><tr><td>Last day open, filing missed by an hour (suit)</td><td>No</td><td>Not available (suit)</td></tr><tr><td>Last day closed (appeal)</td><td>Yes</td><td>Not needed</td></tr><tr><td>Court closed on a day <i>before</i> the last day</td><td>No extension</td><td>Only if sufficient cause (appeal/application)</td></tr><tr><td>Appeal one week late, sufficient cause shown</td><td>No</td><td>Yes: may be admitted</td></tr></table>", "recall": "<b>Quick recall</b>s.4: closed court on the <i>expiry day</i> means file on the re-opening day (any suit, appeal, application). s.5: sufficient cause excuses delay, but only for appeals and applications."}, "3": {"intro": "The law pauses the clock for three kinds of person: the minor, the insane and the idiot. Four sections: the rule (s.6), joint claimants (s.7), the brakes (s.8) and the reminder that a disability arising later changes nothing (s.9). Work the gate first, then read the sections.", "rails": [{"code": "s.6", "term": "Legal disability", "sub": "minor, insane or idiot when time begins to run", "exam": true, "ess": "The disability rule", "hook": "The clock waits outside the door until the disability ends.", "plain": "<b>Ingredients.</b> (1) The person is entitled to sue, or to apply for execution of a decree; (2) at the time from which the period is <b>reckoned</b> he is a <b>minor, insane or an idiot</b>; then (3) he may sue within the same period <b>after the disability has ceased</b>. Sub-sections (2) to (4) handle two disabilities, death during disability, and a disabled representative.", "tag": "Adjusts: period (extension)", "links": [{"l": "s.7", "m": 3, "sec": "s.7"}, {"l": "s.8", "m": 3, "sec": "s.8"}, {"l": "s.9", "m": 3, "sec": "s.9"}, {"l": "Art 123", "m": 13, "sec": "Arts 121\u2013132"}], "blocks": [{"h": "s.6 Legal disability", "paras": [{"t": "(1) Where a person entitled to institute a suit [or proceeding] or make an application for the execution of a decree is, at the time from which the period of limitation is to be reckoned, a minor, or insane, or an idiot, he may institute the suit [or proceeding] or make the application within the same period after the disability has ceased, as would otherwise have been allowed from the time prescribed therefore in the third column of the first schedule [or in section 48 of the Code of Civil Procedure, 1908 (Act V of 1908)].", "l": 0}, {"t": "(2) Where such person is, at the time from which the period of limitation is to be reckoned, affected by two such disabilities, or where, before his disability has ceased, he is affected by another disability, he may institute the suit or make the application within the same period, after both disabilities have ceased, as would otherwise have been allowed from the time so prescribed.", "l": 0}, {"t": "(3) Where the disability continues up to the death of such person, his legal representative may institute the suit or make the application within the same period after the death as would otherwise have been allowed from the time so prescribed.", "l": 0}, {"t": "(4) Where such representative is at the date of the death affected by any such disability, the rules contained in sub-sections (1) and (2) shall apply.", "l": 0}], "ills": [{"t": "The right to sue for the hire of a boat accrues to A during his minority. He attains majority four years after such accruer. He may institute his suit at any time within three years from the date of his attaining majority."}, {"t": "A right to sue accrues to Z during his minority. After the accruer, but while Z is still a minor, he becomes insane. Time runs against Z from the date when his insanity and minority cease."}, {"t": "A right to sue accrues to X during his minority. X dies before attaining majority, and is succeed by Y, his minor son. Time runs against Y from the date of his attaining majority."}]}]}, {"code": "s.7", "term": "Disability of one of several plaintiffs", "sub": "can a discharge be given without the disabled person?", "hook": "One disabled partner: does the whole firm get a free pass?", "plain": "The test is <b>whether a discharge can be given without the concurrence</b> of the disabled person. If yes, time runs against all. If no, time runs against none until one can give a discharge alone or the disability ends.", "tag": "Adjusts: period (extension)", "links": [{"l": "s.6", "m": 3, "sec": "s.6"}], "blocks": [{"h": "s.7 Disability of one of several plaintiffs or applicants", "paras": [{"t": "Where one of several persons jointly entitled to institute a suit [or proceeding] or make an application for the execution of a decree is under any such disability, and a discharge can be given without the concurrence of such person, time will run against them all: but, where no such discharge can be given, time will not run as against any of them until one of them becomes capable of giving such discharge without the concurrence of the others or until the disability has ceased.", "l": 0}], "ills": [{"t": "A incurs a debt to a firm of which B, C and D are partners. B is insane, and C is a minor. D can give a discharge of the debt without the concurrence or B and C. Time runs against B, C and D."}, {"t": "A incurs a debt to a firm of which E, F and G are partners. E and F are insane, and G is a minor. Time will not run against any of them until either E or F becomes sane, or G attains majority."}]}]}, {"code": "s.8", "term": "Special exceptions", "sub": "pre-emption excluded; three-year cap", "exam": true, "hook": "The brakes on the brakes.", "plain": "Two limits on ss.6 and 7: (1) they <b>do not apply</b> to suits to enforce rights of <b>pre-emption</b>; (2) they cannot extend the period for more than <b>three years</b> from the end of the disability or the death of the person affected. Work the three Illustrations: they are the best arithmetic in the Act.", "tag": "Adjusts: period (cap)", "links": [{"l": "Art 10", "m": 10, "sec": "Arts 10\u201318"}, {"l": "s.6", "m": 3, "sec": "s.6"}], "blocks": [{"h": "s.8 Special exceptions", "paras": [{"t": "Nothing in section 6 or in section 7 applies to suits to enforce rights of pre-emption, or shall be deemed to extend, for more than three years from the cessation of the disability or the death of the person affected thereby, the period within which any suit must be instituted or application made.", "l": 0}], "ills": [{"t": "A, to whom a right to sue for a legacy has accrued during his minority, attains majority eleven years after such accruer. A has, under the ordinary law, only one year remaining within which to sue. But under section 6 and this section an extension of two years will be allowed him, making in all a period of three years from the date of his attaining majority, within which he may bring his suit."}, {"t": "A right to sue for an hereditary office accrues to A who at the time is insane. Six years after the accruer A recovers his reason. A has six years, under the ordinary law, from the date when his insanity ceased within which to institute a suit. No extension of time will be given him under section 6 read with this section."}, {"t": "A right to sue as landlord to recover possession from a tenant accrues to A, who is an idiot. A dies three years after the accruer, his idiocy continuing up to the date of his death. A\u2019s representative in interest has, under the ordinary law, nine years from the date of A\u2019s death within which to bring a suit. Section 6 read with this section does not extend that time, except where the representative is himself under disability when the representation devolves upon him."}]}]}, {"code": "s.9", "term": "Continuous running of time", "sub": "once time has begun, nothing stops it", "ess": "The disability rule", "hook": "A train that has left the station does not stop for a later passenger\u2019s illness.", "plain": "<b>Rule:</b> once time has begun to run, no subsequent disability or inability to sue stops it. <b>Proviso:</b> if letters of administration to a creditor\u2019s estate are granted to his debtor, time to recover the debt is suspended while the administration continues.", "tag": "Limits: stop-the-clock", "links": [{"l": "s.6", "m": 3, "sec": "s.6"}], "blocks": [{"h": "s.9 Continuous running of time", "paras": [{"t": "Where once time has begun to run, no subsequent disability or inability to sue stops it :", "l": 0}, {"t": "Provided that where letters of administration to the estate of a creditor have been granted to his debtor, the running of the time prescribed for a suit to recover the debt shall be suspended while the administration continues.", "l": 0}], "ills": []}]}], "spar": [{"q": "The right to sue hire of a boat (three-year period) accrues to A while a minor. He attains majority four years later. By when must he sue?", "a": "Within three years of attaining majority (s.6 Illustration (a)). Without s.6 the three years would have run out a year before."}, {"q": "A sane adult\u2019s right accrues in January. In March he goes insane. Does the clock stop? Contrast with a boy who is a minor at accrual.", "a": "No. s.9: once time has begun to run, a later disability does not stop it. The boy is different because the disability existed at the time from which the period is reckoned (s.6(1))."}, {"q": "A minor\u2019s pre-emption claim arises. His guardian sues late. Does s.6 help him? What period applies?", "a": "No. s.8 says ss.6 and 7 do not apply to suits to enforce rights of pre-emption. The ordinary period applies (see Art 10, one year as printed in the Schedule)."}, {"q": "B (insane), C (a minor) and D (adult) are co-creditors of a firm debt. D can give a good discharge alone. When does time run? What changes if only B and C could sign?", "a": "First: against all three, since a discharge can be given without the concurrence of the disabled (s.7, Illustration (a)). If no discharge can be given without the disabled, time does not run against any of them until one can give it or the disability ends (Illustration (b))."}, {"q": "Cross-check with s.2(8): why does s.6(3) matter for an heir?", "a": "An heir is within \u201cplaintiff\u201d (s.2(8)), so a clock running against the deceased runs against him. s.6(3) is the rule that stops the clock for the heir where the disability lasted to death, giving him the same period after the death (subject to s.8)."}], "boundary": "<b>Boundary map: disability</b><table class='btbl'><tr><th>Fact</th><th>Result</th><th>Source</th></tr><tr><td>Minor, insane or idiot <i>when time begins to run</i></td><td>Same period after disability ceases</td><td>s.6(1)</td></tr><tr><td>Two disabilities at that time, or another before the first ceases</td><td>Period runs after <i>both</i> have ceased</td><td>s.6(2)</td></tr><tr><td>Disability lasts until death</td><td>Representative gets the same period after death</td><td>s.6(3)</td></tr><tr><td>Representative is himself under disability at death</td><td>s.6(1) and (2) apply to him</td><td>s.6(4)</td></tr><tr><td>Disability begins <i>after</i> time has started</td><td>No stop</td><td>s.9</td></tr><tr><td>Pre-emption suit</td><td>ss.6 and 7 do not apply</td><td>s.8</td></tr><tr><td>Extension would exceed 3 years from cessation or death</td><td>Capped at 3 years</td><td>s.8</td></tr></table><b>The s.8 cap in numbers (Illustrations):</b><table class='btbl'><tr><th>Facts</th><th>Time left under ordinary law</th><th>Result</th></tr><tr><td>Legacy; majority 11 years after accrual (12-year period)</td><td>1 year</td><td>Extended to 3 years in all</td></tr><tr><td>Hereditary office; sanity regained 6 years after accrual</td><td>6 years</td><td>No extension; ordinary law is longer</td></tr><tr><td>Landlord suit; idiot dies 3 years after accrual</td><td>9 years from death</td><td>No extension, unless representative is himself disabled</td></tr></table><i>Textbook comment, not from this Act:</i> this Act does not fix the age of majority; it comes from the Majority Act, 1875.", "recall": "<b>Quick recall</b>Disability must exist <i>at the start</i> (s.6). Later disability does not stop time (s.9). Joint claimants: can anyone give a discharge alone? If yes, time runs against all (s.7). Cap: nothing extends beyond 3 years from cessation or death; pre-emption excluded (s.8).", "gate": {"start": "g1", "steps": {"g1": {"q": "When the period of limitation starts to run, is the person entitled to sue (or apply) a minor, insane or an idiot?", "law": "s.6(1) \u00b7 s.9", "hint": "Look at the moment time begins. A disability that arises later does not count. Two disabilities in a row: wait until both have ceased (s.6(2)).", "yes": "g2", "no": {"end": "No disability when time started, so s.6 is not engaged. Time runs from the Schedule\u2019s starting point, and a disability arising later does not stop it (s.9).", "tone": "warn"}}, "g2": {"q": "Is the claim a suit to enforce a right of pre-emption?", "law": "s.8", "hint": "s.8 takes pre-emption suits out of ss.6 and 7.", "yes": {"end": "ss.6 and 7 do not apply to pre-emption suits (s.8). The ordinary period runs with no disability extension.", "tone": "warn"}, "no": "g3"}, "g3": {"q": "Are several persons jointly entitled to sue, with at least one of them disabled?", "law": "s.7", "hint": "Think of partners or co-creditors.", "yes": "g3a", "no": "g5"}, "g3a": {"q": "Can a discharge be given without the concurrence of the disabled person?", "law": "s.7 \u00b7 Illustrations (a) and (b)", "hint": "Can another partner or co-creditor sign a valid discharge alone?", "yes": {"end": "Time runs against all of them, disabled or not (s.7; Illustration (a): D can discharge alone).", "tone": "warn"}, "no": {"end": "Time does not run against any of them until one of them can give a discharge alone, or the disability ceases (s.7; Illustration (b)).", "tone": "ok"}}, "g5": {"q": "Did the disability continue until the person\u2019s death?", "law": "s.6(3), (4) \u00b7 Illustration (c)", "hint": "If yes, the right passes to a legal representative.", "yes": "g5a", "no": "g6"}, "g5a": {"q": "Was the legal representative himself under a disability when the person died?", "law": "s.6(4)", "hint": "Illustration (c): the son is a minor.", "yes": {"end": "s.6(1) and (2) apply again to the representative: his time runs from the end of his own disability (s.6(4); Illustration (c)). Then check the s.8 cap.", "tone": "ok"}, "no": {"end": "The representative may sue within the same period after the death (s.6(3)). Then check the s.8 cap: no extension beyond 3 years from the death.", "tone": "ok"}}, "g6": {"q": "Does the time left under the ordinary law already exceed three years from the end of the disability?", "law": "s.8 \u00b7 Illustrations (a) and (b)", "hint": "Count what the ordinary law would still leave after the disability ceased.", "yes": {"end": "No extension. You keep the ordinary time left (s.8 Illustration (b): six years left, nothing added).", "tone": "warn"}, "no": {"end": "The same period runs from the end of the disability, but not beyond three years from cessation (s.6(1) read with s.8; Illustration (a): extended to three years in all).", "tone": "ok"}}}}}, "4": {"intro": "Two stand-alone rules. s.10 says an express trustee can never plead limitation in a suit to follow the trust property. s.11 says Pakistan\u2019s Act governs suits on foreign contracts and lets a foreign limitation rule in only through a very narrow door.", "rails": [{"code": "s.10", "term": "Suits against express trustees and their representatives", "sub": "no bar by any length of time", "exam": true, "hook": "A trustee holds the property for someone else, so he cannot run out the clock on that someone.", "plain": "<b>Ingredients.</b> A suit against (1) a person in whom property has become <b>vested in trust for a specific purpose</b>, or (2) his <b>legal representatives</b> or <b>assigns (not assigns for valuable consideration)</b>, (3) to <b>follow the property or its proceeds</b>, or for an <b>account</b> of them. Such a suit is not barred \u201cby any length of time\u201d. The final paragraph deems religious or charitable endowment property to be trust property and the manager to be the trustee.", "tag": "Limits: no bar", "links": [{"l": "s.2(11)", "m": 1, "sec": "s.2(11)"}, {"l": "Art 98", "m": 12, "sec": "Arts 91\u2013100"}, {"l": "Art 134", "m": 13, "sec": "Arts 134\u2013143"}], "blocks": [{"h": "s.10 Suits against express trustees and their representatives", "paras": [{"t": "Notwithstanding anything hereinbefore contained, no suit against a person in whom property has become vested in trust for any specific purpose, or against his legal representatives or assigns (not being assigns for valuable consideration), for the purpose of following in his or their hands such property or the proceeds thereof, or for an account of such property or proceeds shall be barred by any length of time. [For the purposes of this section any property comprised in a Hindu, Muhammadan or Buddhist religious or charitable endowment shall be deemed to be property vested in trust for a specific purpose, and the manager of any such property shall be deemed to be the trustee thereof.]", "l": 0}], "ills": []}]}, {"code": "s.11", "term": "Suits on foreign contracts", "sub": "Pakistan\u2019s Act governs; narrow foreign defence", "hook": "The contract may be foreign; the courtroom is not.", "plain": "(1) A suit in Pakistan on a contract made in a foreign country is subject to the rules of limitation in this Act. (2) A foreign limitation rule is <b>no defence</b> unless it has <b>extinguished the contract</b> and the parties were <b>domiciled in that country</b> during the period it prescribed.", "tag": "Context", "links": [{"l": "s.2(6)", "m": 1, "sec": "s.2(6)"}, {"l": "Art 115", "m": 12, "sec": "Arts 105\u2013115"}], "blocks": [{"h": "s.11 Suits on foreign contracts", "paras": [{"t": "(1) Suits instituted in [Pakistan] on contracts entered into in a foreign country are subject to the rules of limitation contained in this Act.", "l": 0}, {"t": "(2) No foreign rule of limitation shall be a defence to a suit instituted in [Pakistan] on a contract entered into in a foreign country, unless the rule has extinguished the contract and the parties were domiciled in such country during the period prescribed by such rule.", "l": 0}], "ills": []}]}], "spar": [{"q": "Land is held in express trust for X. Thirty years pass without a demand. Can the trustee plead limitation to X\u2019s suit to recover it?", "a": "No. s.10: no suit against a person in whom property has become vested in trust for a specific purpose, for the purpose of following the property or its proceeds or for an account, is barred by any length of time."}, {"q": "A mortgagee stays in possession after the mortgage is paid off. Is he a trustee for s.10? Which Article governs the mortgagor\u2019s suit for surplus collections?", "a": "Not a \u201ctrustee\u201d: s.2(11) excludes a mortgagee remaining in possession after the mortgage has been satisfied. Art 105 (three years, as printed) applies, running from when the mortgagor re-enters on the property."}, {"q": "A contract was made in England, where it became unenforceable after six years. It is sued on in Pakistan after four years. Which limitation rules apply?", "a": "This Act: s.11(1). The foreign rule is a defence only if it has extinguished the contract and the parties were domiciled there throughout (s.11(2)). Here Pakistan\u2019s own period for breach of contract applies (Art 115, three years as printed), so the suit is out of time under Pakistani law though not under the English."}, {"q": "Does s.10 protect a purchaser for value from the trustee?", "a": "No. s.10 excludes \u201cassigns for valuable consideration\u201d, so ordinary limitation applies to a suit against such a purchaser."}], "boundary": "<b>Boundary map: s.10 (who is a trustee, and who is protected)</b><table class='btbl'><tr><th>Defendant</th><th>No limitation bar (s.10)?</th></tr><tr><td>Person in whom property is vested in trust for a specific purpose</td><td>Yes</td></tr><tr><td>His legal representative</td><td>Yes</td></tr><tr><td>His assign <i>not</i> for valuable consideration</td><td>Yes</td></tr><tr><td>His assign <i>for valuable consideration</i></td><td>No, ordinary limitation applies</td></tr><tr><td>Benamidar; mortgagee in possession after satisfaction; wrong-doer without title (s.2(11))</td><td>Not \u201ctrustees\u201d for the Act</td></tr><tr><td>Manager of a Hindu, Muhammadan or Buddhist religious or charitable endowment</td><td>Deemed trustee (s.10 second paragraph)</td></tr></table><b>s.11(2): when a foreign rule is a defence</b><table class='btbl'><tr><th>Foreign limitation rule\u2026</th><th>Defence in Pakistan?</th></tr><tr><td>Has extinguished the contract <i>and</i> parties were domiciled there throughout</td><td>Yes</td></tr><tr><td>Has extinguished the contract, but a party was not domiciled there</td><td>No</td></tr><tr><td>Only bars the remedy there</td><td>No</td></tr></table>", "recall": "<b>Quick recall</b>s.10: trust property and its proceeds can be followed against the trustee, his representatives and gratuitous assigns \u201cby any length of time\u201d. s.11: Pakistan\u2019s Act governs; a foreign rule defends only if it extinguished the contract and both parties were domiciled there for the period."}, "5": {"intro": "Part III opens with the subtraction rules. Time spent getting a copy, time the defendant was away, time spent honestly in the wrong court, time under an injunction or notice: each is subtracted before you count. Read them as a list of things you may deduct from the period.", "rails": [{"code": "s.12", "term": "Exclusion of time in legal proceedings", "sub": "start day, judgment day, time to obtain copies", "exam": true, "ess": "Excluding time", "hook": "You never count the day the clock starts, and you never pay for the court\u2019s paperwork delay.", "plain": "<b>Five subtractions.</b> (1) The day from which the period is reckoned is always excluded, for suit, appeal and application. (2) For an <b>appeal, leave to appeal or review</b>: the day the judgment was pronounced, plus the time requisite for obtaining a copy of the decree, sentence or order. (3) Where a decree is appealed or reviewed, the time requisite for a copy of the <b>judgment</b> on which it is founded too. (4) For an application to set aside an <b>award</b>: copy time of the award. (5) Copy time is the time between applying for the copy and the day intimated as the day it will be ready.", "tag": "Adjusts: time excluded", "links": [{"l": "s.5", "m": 2, "sec": "s.5"}, {"l": "s.14", "m": 5, "sec": "s.14"}], "blocks": [{"h": "s.12 Exclusion of time in legal proceedings", "paras": [{"t": "(1) In computing the period of limitation prescribed for any suit, appeal or application, the day from which such period is to be reckoned shall be excluded.", "l": 0}, {"t": "(2) In computing the period of limitation prescribed for an appeal, an application for leave to appeal and an application for a review of judgment, the day on which the judgment complained of was pronounced, and the time requisite for obtaining a copy of the decree, sentence or order appealed from or sought to be reviewed, shall be excluded.", "l": 0}, {"t": "(3) Where a decree is appealed from or sought to be reviewed, the time requisite for obtaining a copy of the judgment on which it is founded shall also be excluded.", "l": 0}, {"t": "(4) In computing the period of limitation prescribed for an application to set aside an award, the time requisite for obtaining a copy of the award shall be excluded.", "l": 0}, {"t": "[(5) For the purposes of sub-sections (2), (3) and (4), the time requisite for obtaining a copy of the decree, sentence, order, judgment or award shall be deemed to be the time intervening between the day on which an application for the copy is made and the day actually intimated to the applicant to be the day on which the copy will be ready for delivery.]", "l": 0}], "ills": []}]}, {"code": "s.13", "term": "Absence of defendant", "sub": "time the defendant was absent from Pakistan is excluded", "exam": true, "hook": "A defendant who has left the country cannot pocket the days he spent away.", "plain": "For a <b>suit</b>, the time during which the defendant was absent from Pakistan, and from certain territories beyond Pakistan under the administration of the Federal Government, is excluded. The printed text carries amendment marks and omitted words; read it as it appears in the bare act.<br><i>Textbook comment, not from the Act:</i> s.13 is framed for suits, not appeals or applications.", "tag": "Adjusts: time excluded", "links": [{"l": "s.12", "m": 5, "sec": "s.12"}], "blocks": [{"h": "s.13 Exclusion of time of defendants, absence from Pakistan and certain other territories", "paras": [{"t": "In computing the period of limitation prescribed for any suit, the time during which the defendant has been absent from [Pakistan] and from the territories beyond [Pakistan] under the administration of [the [Federal Government]] * * * shall be excluded.", "l": 0}], "ills": []}]}, {"code": "s.14", "term": "Bona fide proceeding in a court without jurisdiction", "sub": "plaintiff\u2019s time in the wrong court is excluded", "exam": true, "ess": "Excluding time", "hook": "You knocked on the wrong door honestly. The time you waited there does not count against you.", "plain": "<b>Ingredients (suit).</b> (1) The plaintiff has been prosecuting <b>another civil proceeding</b> against the defendant, in a court of first instance or appeal; (2) with <b>due diligence</b>; (3) the proceeding is on the <b>same cause of action</b>; (4) prosecuted in <b>good faith</b> (s.2(7): due care and attention); (5) in a court that, from <b>defect of jurisdiction or a like cause</b>, could not entertain it. Then that time is excluded. Application: same, against the same party for the same relief.<br><b>Explanations.</b> I: count the day the earlier case was instituted and the day it ended. II: a plaintiff or applicant <b>resisting an appeal</b> is deemed to be prosecuting. III: <b>misjoinder</b> of parties or causes of action is a cause of a like nature with defect of jurisdiction.", "tag": "Adjusts: time excluded", "links": [{"l": "s.2(7)", "m": 1, "sec": "s.2(7)"}, {"l": "s.5", "m": 2, "sec": "s.5"}, {"l": "Art 120", "m": 9, "sec": "Art 120"}], "blocks": [{"h": "s.14 Exclusion of time of proceeding Bona fide in Court without jurisdiction", "paras": [{"t": "(1) In computing the period of limitation prescribed for any suit, the time during which the plaintiff has been prosecuting with due diligence another civil proceeding, whether in a Court of first instance or in a Court of appeal, against the defendant, shall be excluded, where the proceeding is founded upon the same cause of action and is prosecuted in good faith in a Court which, from. defect of jurisdiction, or other cause of a like nature, is unable to entertain it.", "l": 0}, {"t": "(2) In computing the period of limitation prescribed for any application, the time during which the applicant has been prosecuting with due diligence another civil proceeding, whether in a Court of first instance or in a Court of appeal, against the same party for the same relief shall be excluded, where such proceeding is prosecuted in good faith in a Court which, from defect of jurisdiction, or other cause of a like nature, is unable to entertain it.", "l": 0}, {"t": "Explanation I. In excluding the time during which a former suit or application was pending, the day on which that suit or application was instituted or made, and the day on which the proceedings therein ended, shall both be counted.", "l": 0}, {"t": "Explanation II. For the purposes of this section, a plaintiff or an applicant resisting an appeal shall be deemed to be prosecuting a proceeding.", "l": 0}, {"t": "Explanation III.\u2014For the purposes of this section misjoinder of parties or of cause of action shall be deemed to be a cause of a like nature with defect of jurisdiction.", "l": 0}], "ills": []}]}, {"code": "s.15", "term": "Proceedings suspended: injunction, stay, notice", "sub": "the stay period, and the statutory notice period, are excluded", "exam": true, "hook": "If a court or a statute tells you to wait, the waiting is free.", "plain": "(1) For a suit, or an application to execute a decree, whose institution or execution was <b>stayed by injunction or order</b>: exclude the time of the injunction or order, with the day it was issued and the day it was withdrawn. (2) For a suit where <b>notice</b> has been given as required by an enactment: exclude the period of that notice.", "tag": "Adjusts: time excluded", "links": [{"l": "s.14", "m": 5, "sec": "s.14"}], "blocks": [{"h": "s.15 Exclusion of time during which proceedings are suspended", "paras": [{"t": "(1) In computing the period of limitation prescribed for any suit or application for the execution of a decree, the institution or execution of which has been stayed by injunction or order, the time of the continuance of the injunction or order, the day on which it was issued or made and the day on which it was withdrawn, shall be excluded.", "l": 0}, {"t": "(2) In computing the period of limitation prescribed for any suit of which notice has been given in accordance with the requirements of any enactment for the time being in force, the period of such notice shall be excluded.", "l": 0}], "ills": []}]}, {"code": "s.16", "term": "Proceedings to set aside an execution sale", "sub": "purchaser\u2019s suit for possession: that time is excluded", "hook": "The auction-purchaser\u2019s clock waits while someone attacks the sale.", "plain": "For a suit for <b>possession by a purchaser at a sale in execution of a decree</b>, the time during which a proceeding to set aside the sale has been prosecuted is excluded.", "tag": "Adjusts: time excluded", "links": [{"l": "Art 180", "m": 14, "sec": "Arts 176\u2013183"}], "blocks": [{"h": "s.16 Exclusion of time during which proceedings to set aside execution sale are pending", "paras": [{"t": "In computing the period of limitation prescribed for a suit for possession by a purchaser at a sale in execution of a decree, the time during which a proceeding to set aside the sale has been prosecured shall be excluded.", "l": 0}], "ills": []}]}], "spar": [{"q": "Which provision tells you not to count the first day, and does it apply to suits?", "a": "s.12(1): the day from which the period is reckoned is excluded for any suit, appeal or application."}, {"q": "A plaintiff sued in a court that turned out to have no jurisdiction, was honestly there for 8 months, and then filed afresh. What must he show to deduct the 8 months, and what would defeat him?", "a": "Due diligence, good faith (s.2(7): due care and attention), same cause of action, and a court unable to entertain the case from defect of jurisdiction or a like cause (s.14(1)). Carelessness or knowledge that the court lacked jurisdiction defeats good faith."}, {"q": "Is misjoinder of parties a cause like defect of jurisdiction for s.14?", "a": "Yes. Explanation III says misjoinder of parties or of cause of action is a cause of a like nature."}, {"q": "A tenant was away from Pakistan for two years of the three-year period. Can the plaintiff add those years? What about a plaintiff who is late with an appeal because the respondent was abroad?", "a": "For a suit: yes, s.13 excludes the defendant\u2019s absence. For an appeal, s.13 speaks only of a suit, so it does not help; the appellant must rely on s.12 and, if needed, s.5."}, {"q": "Statutory notice of 60 days was required before suing the government. Does the 60 days count?", "a": "s.15(2) excludes the period of such notice, if given in accordance with the requirements of an enactment for the time being in force."}], "boundary": "<b>Boundary map: what s.12 subtracts</b><table class='btbl'><tr><th>Proceeding</th><th>Exclude the start day</th><th>Exclude judgment day</th><th>Exclude copy time</th></tr><tr><td>Suit (any)</td><td>Yes, s.12(1)</td><td>No</td><td>No</td></tr><tr><td>Appeal</td><td>Yes</td><td>Yes, s.12(2)</td><td>Decree/order, and judgment on which founded (s.12(2),(3))</td></tr><tr><td>Leave to appeal</td><td>Yes</td><td>Yes</td><td>Same</td></tr><tr><td>Review</td><td>Yes</td><td>Yes</td><td>Same</td></tr><tr><td>Set aside an award</td><td>Yes</td><td>No (only copy time)</td><td>Copy of the award, s.12(4)</td></tr></table><b>How copy time is measured, s.12(5)</b>: from the day an application for the copy is made to the day intimated as the day the copy will be ready.<br><b>s.14 side by side</b><table class='btbl'><tr><th></th><th>Suit, s.14(1)</th><th>Application, s.14(2)</th></tr><tr><td>Earlier proceeding</td><td>Another civil proceeding against the defendant, same cause of action</td><td>Another civil proceeding against the same party for the same relief</td></tr><tr><td>Court level</td><td>First instance or appeal</td><td>First instance or appeal</td></tr><tr><td>Conditions</td><td>Due diligence and good faith; court unable to entertain from defect of jurisdiction or like cause</td><td>Same</td></tr></table><b>Counting the days (Explanation I):</b> the day the earlier case was filed and the day it ended are both counted in the excluded time.", "recall": "<b>Quick recall</b>Subtract: the start day (s.12(1)); judgment day and copy time for appeals, leave and review (s.12(2)-(3)); award copy time (s.12(4)); defendant absent from Pakistan (s.13); time bona fide in a court lacking jurisdiction (s.14); injunction or notice period (s.15); proceedings to set aside an execution sale (s.16)."}, "6": {"intro": "Six rules that change when the clock starts: a death before the right accrues (s.17), fraud (s.18), a new party (s.22), a wrong that keeps going (s.23), harm that shows up later (s.24) and dates in instruments (s.25).", "rails": [{"code": "s.17", "term": "Death before the right to sue accrues", "sub": "the clock waits for a legal representative", "exam": true, "hook": "No one to sue or be sued, so no time to run.", "plain": "(1) The would-be plaintiff dies before the right accrues: time is computed from when there is a legal representative <b>capable of instituting</b> the suit or application. (2) The would-be defendant dies before the right accrues: time from when there is a legal representative <b>against whom</b> it may be instituted. (3) Neither applies to suits to enforce <b>pre-emption</b>, or for <b>possession of immoveable property</b> or an <b>hereditary office</b>.", "tag": "Adjusts: start point", "links": [{"l": "s.2(8)", "m": 1, "sec": "s.2(1),(4),(8)"}, {"l": "s.6", "m": 3, "sec": "s.6"}, {"l": "Art 10", "m": 10, "sec": "Arts 10\u201318"}], "blocks": [{"h": "s.17 Effect of death before right to sue accrues", "paras": [{"t": "(1) Where a person, who would, if he were living, have a right to institute a suit or make an application, dies before the right accrues, the period of limitation shall be computed from the time when there is a legal representative of the deceased capable of instituting or making such suit or application.", "l": 0}, {"t": "(2) Where a person against whom, if he were living, a right to institute a suit or make an application would have accrued dies before the right accrues, the period of limitation shall be computed from the time when there is a legal representative of the deceased against whom the plaintiff may institute or make such suit or application,", "l": 0}, {"t": "(3) Nothing in sub-sections (1) and (2) applies to suits to enforce rights of pre-emption or to suits for the possession of immoveable property or of an hereditary office.", "l": 0}], "ills": []}]}, {"code": "s.18", "term": "Effect of fraud", "sub": "time runs from when the fraud first became known", "exam": true, "ess": "Fresh starts and shifts", "hook": "Fraud buys the fraudster nothing: your clock does not start until you find out.", "plain": "<b>Ingredients.</b> (1) A person having a right to sue or apply (2) has, by <b>fraud</b>, been kept from knowledge of the right or of the title on which it is founded, <b>or</b> a document necessary to establish the right has been <b>fraudulently concealed</b>; then (3) as against the fraudster or accessory, or anyone claiming through him otherwise than in good faith and for valuable consideration, time is computed from when the fraud <b>first became known</b> to the person injured, or, for a concealed document, when he first had the <b>means of producing it or compelling its production</b>.", "tag": "Adjusts: start point", "links": [{"l": "Art 95", "m": 12, "sec": "Arts 91\u2013100"}, {"l": "s.2(7)", "m": 1, "sec": "s.2(7)"}], "blocks": [{"h": "s.18 Effect of fraud", "paras": [{"t": "Where any person having a right to institute a suit or make an application has, by means of fraud, been kept from the knowledge of such right or of the title on which it is founded,", "l": 0}, {"t": "or where any document necessary to establish such right has been fraudulently concealed from him", "l": 0}, {"t": "the time limited for instituting a suit or making an application", "l": 0}, {"t": "(a) against the person guilty of the fraud or accessory thereto, or", "l": 1}, {"t": "(b) against any person claiming through him otherwise than in good faith and for a valuable consideration,", "l": 1}, {"t": "shall be computed from the time when the fraud first became known to the person injuriously affected thereby, or, in the case of the concealed document, when he first had the means of producing it or compelling its production.", "l": 0}], "ills": []}]}, {"code": "s.22", "term": "Substituting or adding a new plaintiff or defendant", "sub": "a late joiner is treated as suing from joining", "hook": "Joining late means the clock is checked as of the day you joined.", "plain": "(1) Where after institution a <b>new plaintiff or defendant is substituted or added</b>, the suit is deemed instituted, as regards him, when he was so made a party. (2) Not so where the change is owing to an <b>assignment or devolution of interest</b> during the suit, or where a plaintiff is made a defendant or the reverse.", "tag": "Adjusts: start point", "links": [{"l": "s.2(8)", "m": 1, "sec": "s.2(1),(4),(8)"}, {"l": "s.3", "m": 1, "sec": "s.3"}], "blocks": [{"h": "s.22 Effect of substituting or adding new plaintiff or defendant", "paras": [{"t": "(1) Where, after the institution of a suit, a new plaintiff or defendant is substituted or added, the suit shall, as regards him, be deemed to have been instituted when he was so made a party.", "l": 0}, {"t": "(2) Nothing in sub-section (1) shall apply to a case where a party is added or substituted owing to an assignment or devolution of any interest during the pendency of a suit or where a plaintiff is made a defendant or a defendant is made a plaintiff.", "l": 0}], "ills": []}]}, {"code": "s.23", "term": "Continuing breaches and wrongs", "sub": "a fresh period begins at every moment", "ess": "Fresh starts and shifts", "exam": true, "hook": "A dripping tap leaks a fresh limitation period every second.", "plain": "In a <b>continuing breach of contract</b> and a <b>continuing wrong independent of contract</b>, a fresh period of limitation begins to run at every moment the breach or wrong continues.<br><i>Textbook comment, not from the Act:</i> the contrast is a wrong that is complete once and for all, where the damage that follows does not make it continuing.", "tag": "Fresh start", "links": [{"l": "s.24", "m": 6, "sec": "s.24"}, {"l": "Art 115", "m": 12, "sec": "Arts 105\u2013115"}], "blocks": [{"h": "s.23 Continuing breaches and wrongs", "paras": [{"t": "In the case of a continuing breach of contract and in the case of a continuing wrong independent of contract, a fresh period of limitation begins to run at every moment of the time during which the breach or the wrong, as the case may be, continues.", "l": 0}], "ills": []}]}, {"code": "s.24", "term": "Compensation for act not actionable without special damage", "sub": "time runs from the time the injury results", "hook": "No harm yet, no case yet, no clock yet.", "plain": "Where the act gives no cause of action <b>unless some specific injury actually results</b>, limitation is computed from the time the injury results. Illustration: the subsoil owner digs coal; the surface later subsides; time runs from the <b>subsidence</b>.", "tag": "Adjusts: start point", "links": [{"l": "s.23", "m": 6, "sec": "s.23"}], "blocks": [{"h": "s.24 Suit for compensation for act not actionable without special damage", "paras": [{"t": "In the case of a suit for compensation for an act which does not give rise to a cause of action unless some specific injury actually results therefrom, the period of limitation shall be computed from the time when the injury results.", "l": 0}], "ills": [{"t": "A owns the surface of a field. B owns the subsoil. B digs coal thereout without causing any immediate apparent injury to the surface, but at last the surface subsides. The period of limitation in the case of a suit by A against B runs from the time of the subsidence."}]}]}, {"code": "s.25", "term": "Computation of time in instruments", "sub": "Gregorian calendar", "hook": "Whatever calendar the document used, the court counts in the Gregorian one.", "plain": "All instruments are deemed made with reference to the <b>Gregorian calendar</b>. The two illustrations (a promissory note payable four months after date; a bond for repayment within one year) both run time from the end of the stated period computed by that calendar.", "tag": "Rule of computation", "links": [{"l": "Art 69", "m": 12, "sec": "Arts 65\u201380"}], "blocks": [{"h": "s.25 Computation of time mentioned in instruments", "paras": [{"t": "All instruments shall, for the purposes of this Act, be deemed to be made with reference to the Gregorian calendar.", "l": 0}], "ills": [{"t": "A Hindu makes a promissory note bearing a Native date only, and payable four months after date. The period of limitation applicable to a suit on the note runs from the expiration of four months after date computed according to the Gregorian calendar."}, {"t": "A Hindu makes a bond, bearing a Native date only, for the repayment of money within one year. The period of limitation applicable to a suit on the bond runs from the expiration of one year after date computed according to the Gregorian calendar."}]}]}], "spar": [{"q": "A would-be defendant dies before the right accrues. When does time begin against the plaintiff? Does it matter whether the suit is to recover immoveable property?", "a": "From when there is a legal representative against whom the plaintiff may sue (s.17(2)). For a suit for possession of immoveable property, s.17(3) says sub-sections (1) and (2) do not apply."}, {"q": "A forged document was fraudulently concealed from the plaintiff for six years. When does his period start, and against whom?", "a": "Against the fraudster, his accessory, and anyone claiming through him other than in good faith for value, time runs from when the fraud first became known, or for a concealed document when the plaintiff first had the means to produce it or compel its production (s.18). A purchaser in good faith for value is outside the section."}, {"q": "Is a person added as a defendant two years into a suit treated as sued on the original date?", "a": "No. s.22(1): as regards him, the suit is deemed instituted when he was made a party. Exception s.22(2): addition owing to assignment or devolution of interest during the suit, or a switch between plaintiff and defendant."}, {"q": "An adjoining owner keeps blocking a drain. Is limitation measured from the first blocking?", "a": "Not if it is a continuing wrong. s.23: a fresh period begins to run at every moment during which the wrong continues."}, {"q": "Cross-check: s.24 and s.23 both concern harm over time. How do they differ?", "a": "s.24 postpones the start to when the specific injury results from a single act. s.23 renews the period continuously where the breach or wrong itself continues."}], "boundary": "<b>Boundary map: s.17 (death before the right accrues)</b><table class='btbl'><tr><th>Who dies before the right accrues</th><th>Clock starts when</th></tr><tr><td>The would-be plaintiff, s.17(1)</td><td>There is a legal representative able to sue</td></tr><tr><td>The would-be defendant, s.17(2)</td><td>There is a legal representative who can be sued</td></tr><tr><td>Pre-emption, possession of immoveable property, hereditary office, s.17(3)</td><td>Rule does not apply</td></tr></table><b>Boundary map: s.18 (fraud)</b><table class='btbl'><tr><th>Against whom</th><th>Postponed start?</th></tr><tr><td>The person guilty of the fraud or accessory</td><td>Yes</td></tr><tr><td>Anyone claiming through him otherwise than in good faith and for value</td><td>Yes</td></tr><tr><td>A good-faith purchaser for value</td><td>No</td></tr></table><b>s.22: new parties</b><table class='btbl'><tr><th>Event</th><th>Instituted, as against him</th></tr><tr><td>New plaintiff or defendant added or substituted</td><td>When he was made a party</td></tr><tr><td>Added owing to assignment or devolution during the suit</td><td>No change (s.22(2))</td></tr><tr><td>Plaintiff becomes defendant, or defendant plaintiff</td><td>No change (s.22(2))</td></tr></table>", "recall": "<b>Quick recall</b>s.17: no representative, no running clock (not for pre-emption, immoveable property, hereditary office). s.18: clock runs from discovery of the fraud (or when the concealed document could be produced). s.22: a new party is sued from the day he joins. s.23: a continuing wrong renews the period every moment. s.24: time runs from the injury. s.25: Gregorian calendar."}, "7": {"intro": "Sometimes the law wipes the slate. A written acknowledgment (s.19) or a payment on account of a debt (s.20) before the period expires starts a fresh period. s.21 says who can sign or pay, and who cannot bind others. Walk the gate to test a given acknowledgment or payment.", "rails": [{"code": "s.19", "term": "Effect of acknowledgment in writing", "sub": "fresh period from the date signed", "exam": true, "ess": "Fresh starts and shifts", "hook": "Admit it in writing before time runs out, and the clock is reset.", "plain": "<b>Ingredients.</b> (1) An acknowledgment of <b>liability</b> in respect of the property or right; (2) <b>in writing</b>; (3) <b>signed</b> by the party against whom the claim is made, or someone through whom he derives title or liability; (4) made <b>before the period expires</b>. Result: a <b>fresh period</b> from the time it was signed. If undated, oral evidence of the time it was signed is allowed; oral evidence of its contents is not (subject to the Evidence Act). Explanation III: an application to execute a decree is an application in respect of a right.", "tag": "Fresh start", "links": [{"l": "s.21", "m": 7, "sec": "s.21"}, {"l": "s.20", "m": 7, "sec": "s.20"}, {"l": "Art 120", "m": 9, "sec": "Art 120"}], "blocks": [{"h": "s.19 Effect of acknowledgment in writing", "paras": [{"t": "(1) Where, before the expiration of the period prescribed for a suit or application respect of any property or right, an acknowledgment of liability in respect of such property or right has been made in writing signed by the party against whom such property or right is claimed, or by some person through whom he derives title or liability, a fresh period of limitation shall be computed from the time which the acknowledgment was so signed.", "l": 0}, {"t": "(2) Where the writing containing the acknowledgment is undated, oral evidence may be given of the time when it was signed; but, subject to the provisions of the Evidence Act. 1872 (I of 1872) oral evidence of its contents shall not be received.", "l": 0}, {"t": "Explanation I. For the purposes of this section an acknowledgment may be sufficient though it omits to specify the exact nature of the property or right, or avers that the time for payment, delivery, performance or enjoyment has not yet come, or is accompanied by a refusal to pay, deliver, perform or permit to enjoy, or is coupled with a claim to a set-off, or is addressed to a person other than the person entitled to the property or right.", "l": 0}, {"t": "Explanation II. For the purposes of this section, \u201csigned\u201d means signed either personally or by an agent duly authorized in this behalf.", "l": 0}, {"t": "Explanation III. For the purposes of this section an application for the execution of a decree or order is an application in respect of a right.", "l": 0}], "ills": []}]}, {"code": "s.20", "term": "Payment on account of debt or of interest on legacy", "sub": "fresh period from the date of payment", "exam": true, "ess": "Fresh starts and shifts", "hook": "Paying something is an admission with money attached.", "plain": "(1) Payment on account of a <b>debt</b> or of <b>interest on a legacy</b>, made before the period expires by the person liable or his duly authorised agent: a fresh period from the time of payment, with the proviso about a written acknowledgment of the payment. (2) Where <b>mortgaged land is in the mortgagee\u2019s possession</b>, receipt of rent or produce is deemed payment. Explanation: debt includes money payable under a decree or order.", "tag": "Fresh start", "links": [{"l": "s.19", "m": 7, "sec": "s.19"}, {"l": "s.21", "m": 7, "sec": "s.21"}], "blocks": [{"h": "s.20 Effect of payment on account of debt or of interest on legacy", "paras": [{"t": "[(1) Where payment on account of a debt or of interest on a legacy is made before the expiration of the prescribed period by the person liable to pay the debt or legacy, or by his duly authorised agent, a fresh period of limitation shall be computed from the time when the payment was made:] [Provided that * * * an acknowledgment of the payment appears in the handwriting of, or in a writing signed by, the person making the payment.]", "l": 0}, {"t": "(2) Where mortgaged land is in the possession of the mortgagee, the receipt of the rent or produce of such land shall be deemed to be a payment for the purpose of sub-section (1).", "l": 0}, {"t": "Explanation. Debt includes money payable under a decree or order of Court.", "l": 0}], "ills": []}]}, {"code": "s.21", "term": "Agent of person under disability", "sub": "guardians, joint obligors, Hindu family", "hook": "Who may speak for whom, and who cannot bind anyone else.", "plain": "(1) For a person under disability, \u201cagent duly authorised\u201d includes his lawful guardian, committee or manager, or an agent they authorise. (2) One of several joint contractors, partners, executors or mortgagees is not chargeable <b>by reason only</b> of another\u2019s acknowledgment or payment. (3) Special rules for the widow or limited owner under Hindu law and for the manager of a Hindu undivided family, as printed (in brackets in this text).", "tag": "Fresh start (limits)", "links": [{"l": "s.19", "m": 7, "sec": "s.19"}, {"l": "s.20", "m": 7, "sec": "s.20"}], "blocks": [{"h": "s.21 Agent of person under disability", "paras": [{"t": "(1) The expression \u201cagent duly authorized in his behalf,\u201d in sections 19 and 20, shall, in the case of a person under disability, include his lawful guardian, committee or manager, or an agent duly authorised by such guardian, committee or manager to sign the acknowledgment or make the payment.", "l": 0}, {"t": "(2) Nothing in the said sections renders one of several joint contractors, partners, executors or mortgagees chargeable by reason only of a written acknowledgment signed or of a payment made by, or by the agent of, any other or others of them.", "l": 0}, {"t": "[(3) For the purposes of the said sections.", "l": 0}, {"t": "(a) an acknowledgment signed, or a payment made, in respect of any liability, by, or by the duly authorised agent of, any widow or other limited owner of property who is governed by the Hindu law, shall be a valid acknowledgment or payment, as the case may be, as against a reversioner succeeding to such liability; and", "l": 1}, {"t": "(b) where a liability has been incurred by, or on behalf of, a Hindu undivided family as such, an acknowledgment or payment made by, or by the duly authorised agent of, the manager of the family for the time being shall be deemed to have been made on behalf of the whole family.]", "l": 1}], "ills": []}]}], "spar": [{"q": "A debtor signs a letter on day 350 of a one-year period: \u201cI owe you the money but I will not pay yet.\u201d Fresh start?", "a": "Yes. Explanation I to s.19 says an acknowledgment may be sufficient though it avers that the time for payment has not come or is accompanied by a refusal to pay. A fresh period runs from signing."}, {"q": "Same letter, written on day 380. Fresh start?", "a": "No. s.19(1) requires the acknowledgment before the expiration of the period."}, {"q": "A letter acknowledging the debt is undated. Can the creditor prove its date and its contents orally?", "a": "Date: yes, oral evidence of when it was signed may be given (s.19(2)). Contents: no, oral evidence of its contents shall not be received, subject to the Evidence Act, 1872."}, {"q": "One of three partners acknowledges a firm debt in writing. Does time restart against the other two?", "a": "Not by reason only of that: s.21(2) says one of several joint contractors, partners, executors or mortgagees is not chargeable only because another signed an acknowledgment or made a payment."}, {"q": "Mortgagee in possession collects rent for years. Does this restart the clock against the mortgagor?", "a": "s.20(2): receipt of rent or produce from mortgaged land in the mortgagee\u2019s possession is deemed payment for s.20(1), so, subject to the proviso, a fresh period runs from each payment."}], "boundary": "<b>Boundary map: what a valid acknowledgment looks like (s.19 Explanations)</b><table class='btbl'><tr><th>Feature</th><th>Still valid?</th></tr><tr><td>Omits the exact nature of the property or right</td><td>Yes</td></tr><tr><td>Says the time for payment, delivery, performance or enjoyment has not come</td><td>Yes</td></tr><tr><td>Refuses to pay, deliver, perform or permit enjoyment</td><td>Yes</td></tr><tr><td>Coupled with a claim to a set-off</td><td>Yes</td></tr><tr><td>Addressed to someone other than the person entitled</td><td>Yes</td></tr><tr><td>Not in writing</td><td>No</td></tr><tr><td>Made after the period has expired</td><td>No</td></tr><tr><td>Unsigned</td><td>No</td></tr></table><b>Who signs or pays (s.21)</b><table class='btbl'><tr><th>Person</th><th>Effect</th></tr><tr><td>Party personally or duly authorised agent</td><td>Valid (s.19 Expl II)</td></tr><tr><td>Person under disability: guardian, committee, manager or their agent</td><td>Valid (s.21(1))</td></tr><tr><td>One of several joint contractors, partners, executors or mortgagees</td><td>Does not charge the others (s.21(2))</td></tr><tr><td>Manager of a Hindu undivided family</td><td>Binds the whole family (s.21(3)(b))</td></tr></table>", "recall": "<b>Quick recall</b>Acknowledgment: in writing, signed, before expiry, by the party or someone through whom he derives title or liability; fresh period from signing; undated writing: oral evidence of date but not of contents. Payment: before expiry, by the person liable or his agent; proviso needs an acknowledgment of the payment in writing; fresh period from payment; mortgagee\u2019s receipt of rent counts.", "gate": {"start": "a0", "steps": {"a0": {"q": "Is the thing relied on a written acknowledgment of liability (rather than a payment)?", "law": "s.19 \u00b7 s.20", "hint": "Answer No if it is a payment of debt or of interest on a legacy.", "yes": "a1", "no": "p1"}, "a1": {"q": "Was it made before the period of limitation for the suit or application expired?", "law": "s.19(1)", "hint": "After expiry the clock cannot be restarted this way.", "yes": "a2", "no": {"end": "No fresh period. s.19(1) requires the acknowledgment to be made before the expiration of the prescribed period.", "tone": "warn"}}, "a2": {"q": "Is it signed by the party against whom the right is claimed, or by someone through whom he derives title or liability (personally or through a duly authorised agent)?", "law": "s.19(1) \u00b7 Explanation II \u00b7 s.21(1)", "hint": "For a person under disability, a lawful guardian, committee or manager can sign (s.21(1)).", "yes": "a3", "no": {"end": "No fresh period. The writing must be signed by the party, or someone through whom he derives title or liability, or an agent duly authorised (s.19(1); Explanation II).", "tone": "warn"}}, "a3": {"q": "Is the defendant sued only because another joint contractor, partner, executor or mortgagee signed?", "law": "s.21(2)", "hint": "Co-obligors do not bind one another by their acknowledgments.", "yes": {"end": "The signature does not charge him. s.21(2): one of several joint contractors, partners, executors or mortgagees is not chargeable by reason only of an acknowledgment signed by another.", "tone": "warn"}, "no": {"end": "A fresh period runs from the time the acknowledgment was signed (s.19(1)). If it is undated, oral evidence may show when it was signed, but oral evidence of its contents is not received, subject to the Evidence Act (s.19(2)).", "tone": "ok"}}, "p1": {"q": "Was payment on account of a debt, or of interest on a legacy, made before the period expired?", "law": "s.20(1)", "hint": "Debt includes money payable under a decree or order (Explanation).", "yes": "p2", "no": {"end": "No fresh period. s.20(1) requires payment before the expiration of the prescribed period.", "tone": "warn"}}, "p2": {"q": "Was it made by the person liable to pay, or by his duly authorised agent?", "law": "s.20(1) \u00b7 s.21", "hint": "Mortgaged land in the mortgagee\u2019s possession: receipt of rent or produce counts as payment (s.20(2)).", "yes": "p3", "no": {"end": "No fresh period. The payment must be by the person liable or his duly authorised agent (s.20(1); s.21).", "tone": "warn"}}, "p3": {"q": "Does an acknowledgment of the payment appear in the handwriting of, or a writing signed by, the person making it?", "law": "s.20(1) proviso", "hint": "The printed text carries omitted words before \u201can acknowledgment\u201d; read the proviso as printed.", "yes": {"end": "A fresh period runs from the time the payment was made (s.20(1)).", "tone": "ok"}, "no": {"end": "The proviso as printed is not met, so no fresh period on this payment, subject to the words omitted from the proviso in this text.", "tone": "warn"}}}}}, "8": {"intro": "Two last Part III-style items. First, easements: how twenty years of open, peaceable use becomes a right, and how a reversioner\u2019s time is subtracted (ss.26 and 27). Second, the savings (s.29), which tell you where this Act stops: the Contract Act, special laws, divorce suits and the Easements Act.", "rails": [{"code": "s.26", "term": "Acquisition of right to easements", "sub": "twenty years, absolute and indefeasible", "exam": true, "hook": "Use a path openly for twenty years, as if it were yours, and it becomes yours.", "plain": "<b>Ingredients.</b> (1) Access to <b>light or air</b> to a building, or a <b>way, watercourse, use of water or other easement</b>; (2) <b>peaceably and openly</b> enjoyed, <b>as an easement and as of right</b>; (3) <b>without interruption</b> for <b>twenty years</b>; then the right is <b>absolute and indefeasible</b>. The twenty years must end within two years before the suit. (2) Government property: <b>sixty</b> years. Explanation: an interruption is an actual discontinuance by obstruction by another, submitted to or acquiesced in for <b>one year</b> after notice.", "tag": "Acquisition by use", "links": [{"l": "s.2(5)", "m": 1, "sec": "s.2(5)"}, {"l": "s.27", "m": 8, "sec": "s.27"}, {"l": "s.29", "m": 8, "sec": "s.29"}], "blocks": [{"h": "s.26 Acquisition of right to easements", "paras": [{"t": "(1) Where the access and use of light or air to and for any building have been peaceably enjoyed therewith as an easement, and as of right, without interruption, and for twenty years, and where any way or watercourse, or the use of any water, or any other easement (whether a
